{% assign measurement_id = site.ga4_measurement_id | strip %}
{% if jekyll.environment == 'production' and measurement_id != '' %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ measurement_id | url_encode }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { window.dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', {{ measurement_id | jsonify }});
</script>
{% endif %}
